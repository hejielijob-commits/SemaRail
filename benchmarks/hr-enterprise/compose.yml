services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: hr_enterprise
      POSTGRES_USER: hr_benchmark_owner
      POSTGRES_PASSWORD: hr_benchmark_local_only
    ports:
      - "${HR_BENCHMARK_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_benchmark_owner -d hr_enterprise"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - hr-enterprise-postgres:/var/lib/postgresql/data
      - ../../.benchmark-data/hr-enterprise/generated:/benchmark-data:ro
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./sql/002_load.sql:/docker-entrypoint-initdb.d/002_load.sql:ro

volumes:
  hr-enterprise-postgres:

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            python/sidecar/pyproject.toml
            apps/semantic-console/pyproject.toml

      - name: Install Python test dependencies
        run: python -m pip install -e './python/sidecar[test,mcp]' -e './apps/semantic-console'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        env:
          PYTHON: python
        run: pnpm test

      - name: Wren native MCP acceptance
        run: pnpm acceptance:mcp

      - name: Build
        run: pnpm build

name: Feature request
description: Propose a focused improvement to SemaRail.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or integration problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior without requiring a specific implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
      description: What workarounds or alternative designs have you considered?
  - type: textarea
    id: security
    attributes:
      label: Security and compatibility impact
      description: Note effects on SQL safety, credentials, protocols, WrenAI, or DeepSeek Harness compatibility.

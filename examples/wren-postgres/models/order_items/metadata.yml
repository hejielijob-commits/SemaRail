name: order_items
table_reference:
  schema: public
  table: order_items
primary_key: id
columns:
  - name: id
    type: INTEGER
    is_primary_key: true
    not_null: true
  - name: order_id
    type: INTEGER
    not_null: true
  - name: product_id
    type: INTEGER
    not_null: true
  - name: quantity
    type: INTEGER
    not_null: true
  - name: unit_price
    type: DECIMAL
    not_null: true
  - name: discount_amount
    type: DECIMAL
  - name: line_revenue
    type: DECIMAL
    is_calculated: true
    expression: "quantity * unit_price - COALESCE(discount_amount, 0)"
  - name: order
    type: orders
    relationship: order_items_order
  - name: product
    type: products
    relationship: order_items_product
